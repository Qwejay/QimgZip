<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景渐变：现代科技感蓝 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <!-- 1. 最底层：大圆角底板 -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>

  <!-- 2. 压缩前隐喻：虚线外框 (原大小) -->
  <rect x="176" y="176" width="672" height="672" rx="128"
        fill="none" stroke="#FFFFFF" stroke-width="24"
        stroke-dasharray="40 40" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- 3. 压缩后隐喻：实心内框 (缩小后的体积) -->
  <rect x="288" y="288" width="448" height="448" rx="96" fill="#FFFFFF"/>

  <!-- 4. 极简风图形 (采用谷歌 Material UI 色调，层级分明，不杂乱) -->
  
  <!-- 太阳：使用对比明亮的暖黄色，提亮点缀，打破纯蓝的单调 -->
  <circle cx="624" cy="416" r="48" fill="#FFCA28"/>

  <!-- 后景山脉：浅蓝色，拉开空间层次 -->
  <!-- 使用了 Q 贝塞尔曲线，保证山峰是丝滑的圆角，不尖锐刺眼 -->
  <path d="M 464 680 L 592 510 Q 608 488 624 510 L 720 680 Z" fill="#90CAF9"/>

  <!-- 前景山脉：品牌主色蓝，稳重清晰 -->
  <path d="M 304 680 L 464 456 Q 480 432 496 456 L 640 680 Z" fill="#1E88E5"/>
  
</svg>
